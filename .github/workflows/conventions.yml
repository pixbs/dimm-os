# The required check "conventions": no tool attribution, a Conventional Commit title, a linked
# issue. After a merge it runs again on main and compares the live settings with the files here.
#
# On pull requests it runs on pull_request_target, so the workflow and the scripts come from
# main and a pull request cannot edit the check it has to pass. Three rules keep that safe:
# nothing of the pull request is checked out, installed or cached; its title, description,
# branch and commits are read through the API, never written into a script as ${{ ... }};
# the token can do no more than this job writes.
name: conventions

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: conventions-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  conventions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # removes tool footers from the description
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts
            .github/rulesets

      - name: Pull request
        if: github.event_name == 'pull_request_target'
        env:
          NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/attribution/check.mjs pull-request "$NUMBER"

      - name: Commits that reached main
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: node scripts/attribution/check.mjs push "$BEFORE" "$AFTER"

      - name: Live settings match the files
        if: github.event_name == 'push'
        run: bash scripts/repo/apply-settings.sh --check
